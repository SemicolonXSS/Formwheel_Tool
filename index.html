<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">

<title>FormWheel Tool</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#4f46e5;--accent2:#eef2ff;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:800;color:var(--text);text-decoration:none}.wheel{display:inline-flex;width:26px;height:26px;border:4px solid var(--accent);border-radius:50%;align-items:center;justify-content:center;margin:0 3px;font-size:12px}
.container{max-width:1100px;margin:0 auto;padding:28px 18px 50px}
h1{margin:0 0 7px;font-size:30px}.sub{color:var(--muted);margin:0 0 25px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}
.sidebar,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px}
